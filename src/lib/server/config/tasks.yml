describe_tables:
  description: |
    Write a one-line description of each database table listed below, for a
    "datamap" that helps another model pick the right tables when writing
    queries.

    For EACH table in the input, output exactly one line:
    schema.TableName: what one row represents and what the table is used for

    Rules:
    - Infer meaning from the table and column names. Be specific and concise
      (max ~25 words).
    - Output ONLY those lines, one per input table, in the same order, with no
      preamble and no markdown.

    === TABLES ===
    {tables}
    === END TABLES ===
  expected_out: |
    One line per input table, in input order, each formatted as
    schema.TableName: description
  agent: schema_cataloguer

ask_general:
  description: |
    Answer the user's general SQL Server, PostgreSQL, or SQLite question in the conversation
    that follows.

    Rules:
    - Only answer questions about SQL Server, PostgreSQL, SQLite, or their SQL dialects.
    - You are not connected to any database and have no schema. Never invent
      table or column names. If a question depends on a specific schema, say so
      and answer generically with clearly-placeholder names.
  expected_out: |
    A concise answer. Any SQL goes in a ```sql code block and identify the dialect when it matters.
  agent: sql_expert

ask_database:
  description: |
    Answer questions and write runnable {dialect} SQL against the {database} database. The
    catalog below lists its real tables and columns.

    Rules:
    - Only reference tables and columns that exist in the catalog. If something
      needed is not there, say so instead of inventing it.
    - Use identifier quoting, qualification, limits, functions, and data types valid for {dialect}.
    - Schema-qualify names when the engine supports schemas. Use COUNT(*) for counts.
    - Prefer the smallest set of tables that answers the question.

    === SCHEMA CONTEXT ===
    {context}
    === END SCHEMA CONTEXT ===
  expected_out: |
    A concise answer. Runnable {dialect} SQL in a ```sql code block, plus a brief note on
    how the tables join.
  agent: sql_expert

ask_table:
  description: |
    Answer questions about one table: {table} in the {database} database using {dialect}. Its
    full definition — columns, keys, indexes and foreign key relationships — is
    below, and it is the only schema you have.

    Rules:
    - Only reference columns that appear in the definition below. If something
      needed is not there, say so instead of inventing it.
    - Related tables are known only by name and by the joining columns of their
      foreign keys. You do not have their other columns, so do not guess at them.
    - Use syntax and identifier quoting valid for {dialect}. Schema-qualify names when supported.

    === TABLE CONTEXT ===
    {context}
    === END TABLE CONTEXT ===
  expected_out: |
    A concise answer. Runnable {dialect} SQL in a ```sql code block, plus a brief
    explanation.
  agent: sql_expert
